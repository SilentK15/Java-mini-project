services:
  mysql:
    image: mysql:8.0
    container_name: civicconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tmc_complaints
      MYSQL_USER: ${DB_USERNAME:-tmc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tmc_secret_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-tmc_root_secret_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - civicconnect-net

  backend:
    build:
      context: ./tmc-complaint-manager
      dockerfile: Dockerfile
    container_name: civicconnect-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tmc_complaints?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-tmc_user}
      DB_PASSWORD: ${DB_PASSWORD:-tmc_secret_change_me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      UPLOAD_DIR: /app/uploads
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - civicconnect-net

volumes:
  mysql-data:
  backend-uploads:

networks:
  civicconnect-net:
    driver: bridge

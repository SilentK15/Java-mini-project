services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tmc_complaints
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host", "127.0.0.1", "--protocol", "TCP", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - database

  backend:
    build: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tmc_complaints
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      UPLOAD_DIR: /app/uploads
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      DUPLICATE_LOOKBACK_DAYS: ${DUPLICATE_LOOKBACK_DAYS:-30}
      DUPLICATE_MINIMUM_SCORE: ${DUPLICATE_MINIMUM_SCORE:-0.40}
      DUPLICATE_LOCATION_RADIUS_METERS: ${DUPLICATE_LOCATION_RADIUS_METERS:-1000}
      SLA_RESPONSE_HOURS: ${SLA_RESPONSE_HOURS:-0}
      SLA_RESOLUTION_HOURS: ${SLA_RESOLUTION_HOURS:-0}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      CLASSIFICATION_ENABLED: ${CLASSIFICATION_ENABLED:-false}
      CLASSIFICATION_MINIMUM_CONFIDENCE: ${CLASSIFICATION_MINIMUM_CONFIDENCE:-0.75}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_STAFF_NAME: ${APP_STAFF_NAME:-}
      APP_STAFF_EMAIL: ${APP_STAFF_EMAIL:-}
      APP_STAFF_DEPARTMENT: ${APP_STAFF_DEPARTMENT:-}
      APP_STAFF_PASSWORD: ${APP_STAFF_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthProbe"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    volumes:
      - complaint_uploads:/app/uploads

  frontend:
    build: ../tmc-complaint-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application

volumes:
  mysql_data:
  complaint_uploads:

networks:
  application:
  database:
    internal: true

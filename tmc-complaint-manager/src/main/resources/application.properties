spring.application.name=tmc-complaint-manager

spring.datasource.url=jdbc:mysql://localhost:3306/tmc_complaints
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://tmc-complaint-frontend.vercel.app}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.staff.name=${APP_STAFF_NAME:CivicConnect Staff}
app.staff.email=${APP_STAFF_EMAIL:}
app.staff.password=${APP_STAFF_PASSWORD:}
app.staff.department=${APP_STAFF_DEPARTMENT:}
app.upload-dir=${UPLOAD_DIR:uploads}
app.duplicates.lookback-days=${DUPLICATE_LOOKBACK_DAYS:30}
app.duplicates.minimum-score=${DUPLICATE_MINIMUM_SCORE:0.40}
app.duplicates.location-radius-meters=${DUPLICATE_LOCATION_RADIUS_METERS:1000}
app.classification.enabled=${CLASSIFICATION_ENABLED:true}
app.classification.minimum-confidence=${CLASSIFICATION_MINIMUM_CONFIDENCE:0.50}
app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
app.notifications.provider=${NOTIFICATIONS_PROVIDER:none}
app.notifications.smtp.from=${SMTP_FROM:noreply@tmc.gov.in}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.sla.response-hours=${SLA_RESPONSE_HOURS:0}
app.sla.resolution-hours=${SLA_RESOLUTION_HOURS:0}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.limit=${RATE_LIMIT_LOGIN_LIMIT:30}
app.rate-limit.login.duration-seconds=${RATE_LIMIT_LOGIN_DURATION_SECONDS:60}
app.rate-limit.register.limit=${RATE_LIMIT_REGISTER_LIMIT:30}
app.rate-limit.register.duration-seconds=${RATE_LIMIT_REGISTER_DURATION_SECONDS:60}
app.rate-limit.track.limit=${RATE_LIMIT_TRACK_LIMIT:60}
app.rate-limit.track.duration-seconds=${RATE_LIMIT_TRACK_DURATION_SECONDS:60}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Springdoc OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method


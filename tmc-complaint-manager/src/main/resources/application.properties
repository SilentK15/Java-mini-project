spring.application.name=tmc-complaint-manager

spring.datasource.url=jdbc:mysql://localhost:3306/tmc_complaints
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.staff.name=${APP_STAFF_NAME:CivicConnect Staff}
app.staff.email=${APP_STAFF_EMAIL:}
app.staff.password=${APP_STAFF_PASSWORD:}
app.staff.department=${APP_STAFF_DEPARTMENT:}
app.upload-dir=${UPLOAD_DIR:uploads}
app.duplicates.lookback-days=${DUPLICATE_LOOKBACK_DAYS:30}
app.duplicates.minimum-score=${DUPLICATE_MINIMUM_SCORE:0.40}
app.duplicates.location-radius-meters=${DUPLICATE_LOCATION_RADIUS_METERS:1000}
app.classification.enabled=${CLASSIFICATION_ENABLED:false}
app.classification.minimum-confidence=${CLASSIFICATION_MINIMUM_CONFIDENCE:0.75}
app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
app.sla.response-hours=${SLA_RESPONSE_HOURS:0}
app.sla.resolution-hours=${SLA_RESOLUTION_HOURS:0}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
